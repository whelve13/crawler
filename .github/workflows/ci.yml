name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crawler
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Run Backend Linter (Ruff)
      working-directory: ./backend
      run: ruff check .

    - name: Check for committed secrets and .env files
      run: |
        if git ls-files | grep -E '\.env$'; then
          echo "Error: .env file found in repository"
          exit 1
        fi
        
    - name: Run database migrations
      working-directory: ./backend
      env:
        POSTGRES_SERVER: localhost
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: crawler
      run: |
        alembic upgrade head

    - name: Run Backend Tests
      working-directory: ./backend
      env:
        POSTGRES_SERVER: localhost
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: crawler
      run: |
        pytest tests/ -v

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Run Frontend Linter (oxlint)
      working-directory: ./frontend
      run: npm run lint
      
    - name: Run TypeScript Type Check
      working-directory: ./frontend
      run: npx tsc --noEmit
      
    - name: Run Frontend Tests
      working-directory: ./frontend
      run: npm run test -- --run
      
    - name: Verify Frontend Production Build
      working-directory: ./frontend
      run: npm run build
